name: integration-github
description: "Backup GitHub repositories, issues, and file history"

connectors:
  - type: importer
    protocols:
      - github
    flags: []
    homepage: https://github.com/damoun/plakar-integration-github
    license: ISC
    executable: ./integration-github-importer
  - type: exporter
    protocols:
      - github
    flags: []
    homepage: https://github.com/damoun/plakar-integration-github
    license: ISC
    executable: ./integration-github-exporter
