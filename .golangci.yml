version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - godot
    - misspell
    - bodyclose
    - gosec

  settings:
    godot:
      scope: declarations

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - godot
          - gosec
