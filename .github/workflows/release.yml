name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=PlakarKorp/plakar
  PLAKAR_VERSION: "1.1.0-beta.1"

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make build

      - name: Install plakar CLI
        run: |
          curl -fsSL -O "https://github.com/PlakarKorp/plakar/releases/download/v${PLAKAR_VERSION}/plakar_${PLAKAR_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/PlakarKorp/plakar/releases/download/v${PLAKAR_VERSION}/plakar_${PLAKAR_VERSION}_checksums.txt" \
            | grep "plakar_${PLAKAR_VERSION}_linux_amd64.tar.gz" | sha256sum --check
          tar -xz plakar -f "plakar_${PLAKAR_VERSION}_linux_amd64.tar.gz"
          sudo mv plakar /usr/local/bin/plakar

      - name: Patch manifest version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          sed -i "s/^version:.*/version: ${TAG}/" manifest.yaml

      - name: Create .ptar package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: plakar pkg create manifest.yaml

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ptar-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "*.ptar"
          retention-days: 1

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: dist

      - name: Attach .ptar files to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "${TAG}" dist/*.ptar --repo "${REPO}"
